name: "Copilot Code Review Setup"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml
  push:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Review committed documentation without the internal packages required by the full build.
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
